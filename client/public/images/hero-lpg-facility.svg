<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" role="img" aria-label="DB Gas LPG bulk storage tank, tanker and cylinders">
  <defs>
    <linearGradient id="hfSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f1fb"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="hfTank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#eef2f7"/>
      <stop offset="1" stop-color="#c7d0db"/>
    </linearGradient>
    <linearGradient id="hfCyl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e5e7eb"/>
      <stop offset=".5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <clipPath id="hfCard"><rect width="640" height="460" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#hfCard)">
    <rect width="640" height="460" fill="url(#hfSky)"/>
    <circle cx="540" cy="90" r="46" fill="#ffd8c7"/>
    <!-- distant hills -->
    <path d="M0 300 C 120 250, 220 270, 320 255 C 430 238, 520 262, 640 245 V460 H0 Z" fill="#dbe7f3"/>
    <!-- ground -->
    <rect y="330" width="640" height="130" fill="#e6ebf1"/>
    <rect y="330" width="640" height="6" fill="#cdd6e0"/>

    <!-- security fence -->
    <g stroke="#94a3b8" stroke-width="3">
      <line x1="20" y1="278" x2="620" y2="278"/><line x1="20" y1="300" x2="620" y2="300"/>
      <g stroke-width="4">
        <line x1="40" y1="270" x2="40" y2="332"/><line x1="140" y1="270" x2="140" y2="332"/>
        <line x1="240" y1="270" x2="240" y2="332"/><line x1="340" y1="270" x2="340" y2="332"/>
        <line x1="440" y1="270" x2="440" y2="332"/><line x1="540" y1="270" x2="540" y2="332"/>
      </g>
    </g>

    <!-- bulk storage tank on saddles -->
    <rect x="120" y="262" width="26" height="70" fill="#1b365d"/>
    <rect x="364" y="262" width="26" height="70" fill="#1b365d"/>
    <rect x="70" y="150" width="370" height="122" rx="61" fill="url(#hfTank)" stroke="#94a3b8" stroke-width="3"/>
    <rect x="70" y="200" width="370" height="16" fill="#ff6b35"/>
    <text x="255" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="bold" fill="#1b365d">DB GAS</text>
    <text x="255" y="246" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#475569">LPG  ·  25 TONNE STORAGE</text>
    <!-- valves & piping on top -->
    <rect x="232" y="128" width="46" height="24" rx="4" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
    <circle cx="245" cy="126" r="7" fill="#dc2626"/>
    <circle cx="265" cy="126" r="7" fill="#dc2626"/>
    <path d="M278 140 H470 V300" fill="none" stroke="#f59e0b" stroke-width="7" stroke-linejoin="round"/>
    <rect x="460" y="292" width="22" height="40" rx="4" fill="#64748b"/>

    <!-- tanker truck -->
    <g transform="translate(400 300)">
      <rect x="20" y="0" width="160" height="56" rx="26" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
      <rect x="20" y="24" width="160" height="8" fill="#ff6b35"/>
      <text x="100" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1b365d">DB GAS</text>
      <path d="M180 14 h34 l20 24 v28 h-54 z" fill="#1b365d"/>
      <rect x="190" y="20" width="22" height="16" rx="2" fill="#bfdbfe"/>
      <rect x="14" y="56" width="222" height="10" fill="#334155"/>
      <circle cx="56" cy="72" r="15" fill="#1f2937"/><circle cx="56" cy="72" r="6" fill="#9ca3af"/>
      <circle cx="96" cy="72" r="15" fill="#1f2937"/><circle cx="96" cy="72" r="6" fill="#9ca3af"/>
      <circle cx="206" cy="72" r="15" fill="#1f2937"/><circle cx="206" cy="72" r="6" fill="#9ca3af"/>
    </g>

    <!-- cylinder cage with cylinders -->
    <g transform="translate(40 352)">
      <rect x="0" y="0" width="190" height="86" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
      <g>
        <rect x="14" y="16" width="28" height="62" rx="12" fill="url(#hfCyl)" stroke="#94a3b8" stroke-width="2"/>
        <rect x="50" y="16" width="28" height="62" rx="12" fill="url(#hfCyl)" stroke="#94a3b8" stroke-width="2"/>
        <rect x="86" y="16" width="28" height="62" rx="12" fill="url(#hfCyl)" stroke="#94a3b8" stroke-width="2"/>
        <rect x="122" y="16" width="28" height="62" rx="12" fill="url(#hfCyl)" stroke="#94a3b8" stroke-width="2"/>
        <rect x="158" y="24" width="22" height="54" rx="10" fill="url(#hfCyl)" stroke="#94a3b8" stroke-width="2"/>
      </g>
      <g fill="#dc2626">
        <rect x="18" y="36" width="20" height="10" rx="2"/><rect x="54" y="36" width="20" height="10" rx="2"/>
        <rect x="90" y="36" width="20" height="10" rx="2"/><rect x="126" y="36" width="20" height="10" rx="2"/>
        <rect x="160" y="42" width="18" height="9" rx="2"/>
      </g>
      <g stroke="#94a3b8" stroke-width="2"><line x1="0" y1="10" x2="190" y2="10"/><line x1="0" y1="50" x2="190" y2="50"/></g>
    </g>

    <!-- ZERA badge -->
    <g transform="translate(560 380)">
      <circle r="38" fill="#059669" stroke="#065f46" stroke-width="4"/>
      <text y="-2" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff">ZERA</text>
      <text y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">LICENSED</text>
    </g>
  </g>
</svg>
