<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" role="img" aria-label="Commercial kitchen running on LPG">
  <defs>
    <linearGradient id="ckWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="ckSteel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset=".5" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="ckCyl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e5e7eb"/>
      <stop offset=".5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <radialGradient id="ckFlame" cx=".5" cy=".7" r=".6">
      <stop offset="0" stop-color="#bfdbfe"/>
      <stop offset=".6" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ckCard"><rect width="640" height="460" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#ckCard)">
    <rect width="640" height="460" fill="url(#ckWall)"/>
    <!-- tiles -->
    <g stroke="#e2e8f0" stroke-width="2">
      <line x1="0" y1="80" x2="640" y2="80"/><line x1="0" y1="140" x2="640" y2="140"/><line x1="0" y1="200" x2="640" y2="200"/>
      <line x1="80" y1="40" x2="80" y2="240"/><line x1="160" y1="40" x2="160" y2="240"/><line x1="240" y1="40" x2="240" y2="240"/>
      <line x1="320" y1="40" x2="320" y2="240"/><line x1="400" y1="40" x2="400" y2="240"/><line x1="480" y1="40" x2="480" y2="240"/>
    </g>
    <!-- extractor hood -->
    <path d="M90 40 H450 L480 120 H60 Z" fill="url(#ckSteel)" stroke="#94a3b8" stroke-width="3"/>
    <rect x="230" y="0" width="80" height="40" fill="#cbd5e1"/>

    <!-- range -->
    <rect x="60" y="250" width="420" height="140" rx="6" fill="url(#ckSteel)" stroke="#94a3b8" stroke-width="3"/>
    <rect x="60" y="238" width="420" height="16" fill="#64748b"/>
    <g fill="#334155">
      <circle cx="130" cy="300" r="9"/><circle cx="210" cy="300" r="9"/><circle cx="290" cy="300" r="9"/><circle cx="370" cy="300" r="9"/><circle cx="430" cy="300" r="9"/>
    </g>
    <rect x="90" y="322" width="360" height="54" rx="4" fill="#475569"/>
    <rect x="100" y="332" width="340" height="34" rx="3" fill="#1f2937"/>
    <!-- flames + pots -->
    <ellipse cx="150" cy="232" rx="40" ry="14" fill="url(#ckFlame)"/>
    <ellipse cx="300" cy="232" rx="40" ry="14" fill="url(#ckFlame)"/>
    <rect x="108" y="170" width="84" height="60" rx="6" fill="#475569"/><rect x="100" y="164" width="100" height="10" rx="5" fill="#334155"/>
    <path d="M260 196 h80 l-8 34 h-64 z" fill="#64748b"/><rect x="340" y="200" width="44" height="7" rx="3" fill="#334155"/>
    <g fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" opacity=".8">
      <path d="M135 160 c-10 -14 10 -22 0 -36"/><path d="M165 160 c-10 -14 10 -22 0 -36"/>
    </g>

    <!-- floor -->
    <rect y="390" width="640" height="70" fill="#cbd5e1"/>

    <!-- LPG manifold outside wall (right) -->
    <rect x="500" y="150" width="14" height="240" fill="#94a3b8"/>
    <path d="M480 270 H530 V180 H600" fill="none" stroke="#f59e0b" stroke-width="7" stroke-linejoin="round"/>
    <g transform="translate(528 196)">
      <rect x="10" y="0" width="38" height="120" rx="16" fill="url(#ckCyl)" stroke="#94a3b8" stroke-width="2"/>
      <rect x="58" y="0" width="38" height="120" rx="16" fill="url(#ckCyl)" stroke="#94a3b8" stroke-width="2"/>
      <rect x="15" y="34" width="28" height="14" rx="2" fill="#dc2626"/><rect x="63" y="34" width="28" height="14" rx="2" fill="#dc2626"/>
      <text x="53" y="88" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1b365d">48KG</text>
    </g>
    <circle cx="560" cy="180" r="10" fill="#ff6b35" stroke="#c2410c" stroke-width="2"/>

    <!-- caption -->
    <rect x="24" y="404" width="270" height="40" rx="10" fill="#1b365d"/>
    <text x="159" y="429" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff">Bulk LPG for commercial kitchens</text>
  </g>
</svg>
