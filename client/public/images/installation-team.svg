<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" role="img" aria-label="DB Gas technicians installing an LPG supply line">
  <defs>
    <linearGradient id="itSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b365d"/>
      <stop offset="1" stop-color="#2a5a8f"/>
    </linearGradient>
    <linearGradient id="itCyl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e5e7eb"/>
      <stop offset=".5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <clipPath id="itCard"><rect width="640" height="460" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#itCard)">
    <rect width="640" height="460" fill="url(#itSky)"/>
    <g fill="#ffffff" opacity=".06">
      <circle cx="560" cy="70" r="120"/><circle cx="80" cy="420" r="160"/>
    </g>

    <!-- building -->
    <rect x="300" y="110" width="300" height="270" fill="#f1f5f9"/>
    <rect x="300" y="96" width="300" height="20" fill="#cbd5e1"/>
    <g fill="#bfdbfe" stroke="#94a3b8" stroke-width="2">
      <rect x="330" y="140" width="60" height="50"/><rect x="420" y="140" width="60" height="50"/><rect x="510" y="140" width="60" height="50"/>
      <rect x="330" y="220" width="60" height="50"/><rect x="510" y="220" width="60" height="50"/>
    </g>
    <rect x="420" y="220" width="60" height="160" fill="#1b365d"/>
    <text x="450" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#64748b">COMMERCIAL KITCHEN</text>

    <!-- ground -->
    <rect y="380" width="640" height="80" fill="#e2e8f0"/>
    <rect y="380" width="640" height="6" fill="#cbd5e1"/>

    <!-- gas line from cage to building -->
    <path d="M190 300 H260 V250 H330" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linejoin="round"/>
    <rect x="248" y="282" width="26" height="26" rx="13" fill="#ff6b35" stroke="#c2410c" stroke-width="2"/>
    <rect x="322" y="240" width="14" height="20" fill="#64748b"/>

    <!-- cylinder cage -->
    <g transform="translate(40 270)">
      <rect x="0" y="0" width="160" height="110" rx="6" fill="none" stroke="#e2e8f0" stroke-width="4"/>
      <rect x="18" y="14" width="34" height="94" rx="14" fill="url(#itCyl)" stroke="#94a3b8" stroke-width="2"/>
      <rect x="62" y="14" width="34" height="94" rx="14" fill="url(#itCyl)" stroke="#94a3b8" stroke-width="2"/>
      <rect x="106" y="14" width="34" height="94" rx="14" fill="url(#itCyl)" stroke="#94a3b8" stroke-width="2"/>
      <g fill="#dc2626"><rect x="23" y="40" width="24" height="12" rx="2"/><rect x="67" y="40" width="24" height="12" rx="2"/><rect x="111" y="40" width="24" height="12" rx="2"/></g>
      <g stroke="#e2e8f0" stroke-width="3"><line x1="0" y1="36" x2="160" y2="36"/><line x1="0" y1="72" x2="160" y2="72"/></g>
      <path d="M35 14 V4 H123 V14" fill="none" stroke="#64748b" stroke-width="4"/>
      <path d="M79 4 V-6 H170 V30" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linejoin="round"/>
    </g>

    <!-- technician 1 (kneeling with spanner at regulator) -->
    <g transform="translate(222 300)">
      <path d="M-8 80 l10 -36 h30 l8 36 z" fill="#1b365d"/>
      <rect x="0" y="6" width="34" height="42" rx="8" fill="#ff6b35"/>
      <rect x="0" y="22" width="34" height="5" fill="#fde68a"/>
      <circle cx="17" cy="-6" r="13" fill="#8d5524"/>
      <path d="M2 -10 a15 15 0 0 1 30 0 z" fill="#facc15"/><rect x="0" y="-12" width="34" height="4" rx="2" fill="#eab308"/>
      <path d="M34 20 L52 4" stroke="#8d5524" stroke-width="7" stroke-linecap="round"/>
      <path d="M50 6 l12 -10" stroke="#9ca3af" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- technician 2 (standing with tablet) -->
    <g transform="translate(130 182)">
      <rect x="2" y="70" width="12" height="58" fill="#1b365d"/><rect x="20" y="70" width="12" height="58" fill="#1b365d"/>
      <rect x="0" y="20" width="34" height="54" rx="9" fill="#ff6b35"/>
      <rect x="0" y="40" width="34" height="5" fill="#fde68a"/>
      <circle cx="17" cy="6" r="13" fill="#5c3a1e"/>
      <path d="M2 2 a15 15 0 0 1 30 0 z" fill="#ffffff"/><rect x="0" y="0" width="34" height="4" rx="2" fill="#e5e7eb"/>
      <rect x="30" y="36" width="22" height="28" rx="3" fill="#1f2937"/><rect x="33" y="39" width="16" height="20" fill="#93c5fd"/>
    </g>

    <!-- pressure-test badge -->
    <g transform="translate(560 410)">
      <rect x="-70" y="-26" width="120" height="44" rx="10" fill="#059669"/>
      <text x="-10" y="-6" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">PRESSURE</text>
      <text x="-10" y="10" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">TESTED ✓</text>
    </g>
  </g>
</svg>
